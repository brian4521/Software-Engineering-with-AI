<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    
    let x = 0.5;

    const pickyPromise = new Promise((resolve, reject) => {
        const randomNumber = Math.floor(Math.random() * 10) / 10;

        debugger;

        console.log(randomNumber);

        if (randomNumber == x) {
            setInterval(() => {
                resolve("Great! We got the exact number we were looking for.");
            }, 1000);
        } else {
            setInterval(() => {
                reject("Oops! The generated number did not match our target.");
            }, 1000);
        }
    });
    pickyPromise
        .then((message) => {
            console.log("MISSION ACCOMPLISHED!", message);
            return "Alright, let's see what happens next.";
        })
        .then((message) => {
            console.log(message);
        })
        .catch((error) => {
            console.error("Oh no, something went wrong!", error);
        })
        .finally(() => {
            console.log("And that's it, we're moving forward!");
        });


  </script>
  
</body>
</html>
