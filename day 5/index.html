<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div>
      <img src="https://www.giftcards.com/content/dam/bhn/live/nam/us/en/catalog-assets/product-images/07675022697/07675022697_81054_master.png/_jcr_content/renditions/cq5dam.zoom.2048.2048.jpeg" alt="visa image">
    </div>
    <form class="form-section" id="cardForm" >
        <div class="container">
          <div class="div-container">
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber">

          </div>
          <div class="div-container">
            <label for="cardHolders">Card Holders</label>
            <input type="text" id="cardHolders" name="cardHolders">

          </div>
        </div>
        <div class="div-container-select">
          <label for="expirationDate">Expiration Date</label>
          
            <select id="expirationMonth" name="expirationDate">
                  <option value="month">Month</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
            </select>
            <select name="expirationYear" id="expirationYear">
                  <option value="month">Year</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                
            </select>
            <div class="cvv-container">
              <label for="cvv">cvv</label>
              <input type="number" id="cvv" name="cvv"> 
            </div>
          </div>

        

        <input type="submit" value="Submit" id="input-button">

    </form>

    <table id="recordTable">
      <caption>Form Record</caption>
      <tr>
        <th>Card Number</th>
        <th>Card Holders</th>
        <th>Expiration Date</th>
        <th>CVV</th>
      </tr>
      <tr>
        <td>12345678</td>
        <td>Ritesh</td>
        <td>08</td>
        <td>2083</td>
      </tr>
    </table>
  </main>
  <script src="script.js"></script>
  
</body>
</html>
