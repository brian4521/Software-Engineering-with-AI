<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <form class="form">
    <div class="form-row">
      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        name="fullName"
        placeholder="Enter your Full Name"
      >
    </div>
    <div class="form-row">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your Email"
      >
    </div>
    <div class="form-row">
      <label for="phone">Phone Number</label>

      <div class="phone-input">
        <span>+977</span>
        <input
          type="tel"
          id="phone"
          name="phone"
        >
      </div>
    </div>
    <div class="form-row">
      <label for="address">Address</label>
      <input
        type="text"
        id="address"
        name="address"
        placeholder="Enter your Address"
      >
    </div>
    <div class="form-row">
      <label for="course">Course</label>

      <div class="course-container">
        <select id="course" name="course">
          <option value="">Select your course</option>
          <option value="Project Management">Project Management</option>
          <option value="MERN stack">MERN stack</option>
          <option value="Video Editing">Video Editing</option>
          <option value="Software Engineering with AI">Software Engineering with AI</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label for="education">Education Level</label>

      <select id="education" name="education">
        <option value="">Select your education level</option>
        <option value="see">SEE</option>
        <option value="plus2">+2</option>
        <option value="bachelor">Bachelor</option>
        <option value="master">Master</option>
      </select>
    </div>
    <div class="form-row">
      <label>Preferred Learning<br>Format</label>

      <div class="radio-group">
        <label>
          <input type="radio" name="learningFormat" value="physical">
          Physical
        </label>

        <label>
          <input type="radio" name="learningFormat" value="online">
          Online
        </label>

        <label>
          <input type="radio" name="learningFormat" value="hybrid">
          Hybrid
        </label>
      </div>
    </div>

    <div class="form-row">
      <label>Do you have a Laptop?</label>

      <div class="radio-group">
        <label>
          <input type="radio" name="laptop" value="yes">
          Yes
        </label>

        <label>
          <input type="radio" name="laptop" value="no">
          No
        </label>
      </div>
    </div>
    <div class="form-row">
      <label for="findUs">How did you find us?</label>

      <select id="findUs" name="findUs">
        <option value="">Select an option</option>
        <option value="facebook">Facebook</option>
        <option value="instagram">Instagram</option>
        <option value="youtube">YouTube</option>
        <option value="friend">Friend</option>
        <option value="google">Google</option>
      </select>
    </div>
    <div class="form-row">
      <label>Received any referrals?</label>

      <div class="radio-group">
        <label>
          <input type="radio" name="referral" value="yes">
          Yes
        </label>

        <label>
          <input type="radio" name="referral" value="no">
          No
        </label>
      </div>
    </div>

    <button type="submit">Submit Now</button>

  </form>

</body>
</html>
