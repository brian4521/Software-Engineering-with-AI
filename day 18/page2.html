<body>
  <script>
    const p1 = {
      xp1: "I am inside P1",
    };

    const p2 = {
      xp2: "I am inside p2",
      __proto__: p1,
    };

    const p3 = {
      xp3: "I am inside p3",
      __proto__: p2,
    };

    console.log(p3.xp3);
    console.log(p3.xp2);
    console.log(p3.xp1);
    

  </script>
</body>
