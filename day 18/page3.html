<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let object = {
      name: "Rahul",
      city: "Kathmandu",
      getIntro: function(){
        console.log(this.name + " from " + this.city);
      }
    }

    let object2 = {
      name: "Ansh"
    }

    object2.__proto__ = object;

    object2.getIntro();
  </script>
</body>
</html>
