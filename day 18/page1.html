<body>

  <script>
    const p1 = {
        fname: "Rahul",
        lname: "Sharma",

        getFullname() {
            return `${this.fname} ${this.lname}`;
        },
    };

    const p2 = {
        __proto__: p1,
    };

    console.log("p1 is", p1.fname);

    p2.__proto__.fname = "Updated";

    console.log("p1 after is", p1.fname);
  </script>
  
</body>
