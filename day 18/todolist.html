<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Todo List</title>

  <style>
    body {
      font-family: Arial;
      background-color: #f2f2f2;
    }

    .todo-container {
      width: 400px;
      margin: 50px auto;
      padding: 20px;

      background-color: white;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
    }

    .input-box {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #add-button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: #2563eb;
      color: white;
      cursor: pointer;
    }

    #add-button:hover {
      background-color: #1d4ed8;
    }

    ul {
      padding: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 10px;
      margin-top: 10px;

      background-color: #f2f2f2;
      border-radius: 5px;
    }

    .delete-button {
      background-color: #ef4444;
      color: white;

      border: none;
      border-radius: 5px;

      padding: 7px 10px;
      cursor: pointer;
    }

    .delete-button:hover {
      background-color: #dc2626;
    }
  </style>
</head>

<body>

  <div class="todo-container">

    <h1>Todo List</h1>

    <div class="input-box">

      <input
        type="text"
        id="todo-input"
        placeholder="Enter your task"
      >

      <button id="add-button">Add</button>

    </div>

    <ul id="todo-list"></ul>

  </div>

  <script src="script2.js"></script>

</body>

</html>
